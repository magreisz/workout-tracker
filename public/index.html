<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: o app ocupa a tela toda no iPhone e respeita as áreas seguras. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Meu Treino</title>
    <!-- Instalado pela "Tela de Início", abre sem a barra do Safari e com a barra de status translúcida. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meu Treino" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #0b0c0f;
        color-scheme: dark;
      }
      body {
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Ative o JavaScript para usar o Meu Treino.</noscript>
    <div id="root"></div>
  </body>
</html>
